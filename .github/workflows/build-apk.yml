name: Build APK
on:
  push:
    branches: ['fix/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug assembleFastTest
      - uses: actions/upload-artifact@v4
        with:
          name: speedometer-apks
          path: app/build/outputs/apk/**/*.apk
      - name: Publish test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          name: Test build ${{ github.run_number }} (${{ github.ref_name }})
          prerelease: true
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/fastTest/*.apk
